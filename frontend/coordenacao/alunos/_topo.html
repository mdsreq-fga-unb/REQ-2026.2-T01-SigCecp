<header class="topo">

      <img class="marca__logo" src="{{ url_for('static', path='img/Águia_de_Fogo_em_Voo_Rasante-removebg-preview.png') }}" alt="" width="44" height="44">
      <span class="marca__nome">Centro Esportivo Cultural<br>de Planaltina-DF</span>

    {% with area = 'alunos' %}{% include "coordenacao/_menu.html" %}{% endwith %}

    <div class="topo__direita">

      {% include "coordenacao/_usuario.html" %}

    </div>
  </div>
</header>
