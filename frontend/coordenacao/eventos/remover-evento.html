

<dialog class="modal" id="modal-remover" aria-labelledby="modal-remover-titulo" aria-describedby="modal-remover-desc">
  <form class="modal__corpo" id="form-remover" method="post" action="">
    <div class="modal__topo">
      <span class="modal__icone" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"/>
          <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/>
          <path d="M6 6l1 14a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-14"/>
          <path d="M10 11v6M14 11v6"/>
        </svg>
      </span>
 
      <button type="button" class="modal__fechar" data-fechar-modal aria-label="Fechar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18"/>
        </svg>
      </button>
    </div>
 
    <h2 class="modal__titulo" id="modal-remover-titulo">Remover evento?</h2>
    <p class="modal__evento" id="modal-remover-evento"></p>
 
    <p class="modal__texto" id="modal-remover-desc">
      O evento e todos os seus anexos serão excluídos definitivamente e deixarão de aparecer em todas as listagens públicas e administrativas.
    </p>
    <p class="modal__aviso">Esta ação não pode ser desfeita.</p>
 
    <div class="modal__acoes">
      <button type="button" class="botao botao--claro" data-fechar-modal>Cancelar</button>
      <button type="submit" class="botao botao--vermelho">Remover definitivamente</button>
    </div>
  </form>
</dialog>


{% block scripts %}
<script src="{{ url_for('static', path='js/remover-evento.js') }}" defer></script>
{% endblock %}
