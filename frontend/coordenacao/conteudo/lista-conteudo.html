    <symbol id="i-mais" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>

  <header class="topo">

      <ol>
        <li><a href="#">Coordenação</a></li>

      </div>
      <a class="botao botao--vermelho" href="publicar-conteudo.html">
        <svg class="icone" aria-hidden="true"><use href="#i-mais"/></svg>

      </a>

      </div>
