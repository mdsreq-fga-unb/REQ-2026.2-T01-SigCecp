site_name: SigCecp
site_url: https://github.com/mdsreq-fga-unb/REQ-2026.2-T01-SigCecp

nav: 
  - Home: index.md
  - Visão de produto e projeto:
    - Cenario atual: visao_produto_projeto/1_cenario_atual.md
    - Solução Proposta: visao_produto_projeto/2_solucao_proposta.md
    - Intervenção social: visao_produto_projeto/3_intervencao_social.md
    - Estrategias de ESW: visao_produto_projeto/4_estrategias_esw.md
    - Engenharia de Requisitos: visao_produto_projeto/5_engenharia_req.md
    - Cronograma e entrega: visao_produto_projeto/6_cronograma.md
    - Interação entre a equipe e o cliente: visao_produto_projeto/7_interacao_equipe_e_cliente.md
    - Requisitos: visao_produto_projeto/8_requisitos.md
    - Lições Aprendidas: visao_produto_projeto/11_licoes_aprendidas.md
  - Gravações:
    - Apresentações:
      - Apresentação Unidade 1: gravacoes/apresentacoes/apresentacao_unidade_1.md
  - Atas de Reuniões:
    - Reunião dia 17/09/26: atas_reunioes/ata_reuniao_17_09.md
    - Reunião dia 22/09/26: atas_reunioes/ata_reuniao_22_09.md
    - Reunião dia 24/09/26: atas_reunioes/ata_reuniao_24_09.md

theme:
  name: material
  palette:
    - scheme: default
      primary: black
      accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      toc_depth: "2-4"
  - pymdownx.snippets:
      base_path: ["docs"]

extra_css:
  - stylesheets/extra.css
